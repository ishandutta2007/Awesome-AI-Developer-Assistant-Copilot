<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glowing Orbs -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    <![CDATA[
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #ffffff; stroke-opacity: 0.04; stroke-width: 1; }
    
    /* SMIL and CSS compatible keyframe animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-18px); opacity: 0.9; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-left {
      transform-origin: 220px 120px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .orb-right {
      transform-origin: 980px 280px;
      animation: pulseGlow 9s ease-in-out infinite reverse;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 6.5s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 8s ease-in-out infinite 3s; }

    .beam-line {
      stroke-dasharray: 100 200;
      animation: beamFlow 14s linear infinite;
    }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    ]]>
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" class="bg" />

  <!-- Background Grid Pattern -->
  <g class="grid">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Animated Glowing Ambient Orbs (Background Level) -->
  <circle cx="220" cy="120" r="160" fill="url(#orbGrad1)" class="orb-left" />
  <circle cx="980" cy="280" r="180" fill="url(#orbGrad2)" class="orb-right" />
  <circle cx="600" cy="210" r="130" fill="url(#orbGrad3)" />

  <!-- Dynamic Curved Energy Beams -->
  <path d="M-50,320 C300,180 800,380 1250,160" fill="none" stroke="url(#beamGrad)" stroke-width="2.5" class="beam-line" />
  <path d="M-50,120 C350,300 850,80 1250,280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="beam-line" style="animation-direction: reverse; animation-duration: 18s;" />

  <!-- Dynamic Floating Accent Dots -->
  <circle cx="120" cy="90" r="3.5" fill="#38bdf8" class="particle-1" />
  <circle cx="340" cy="60" r="3" fill="#818cf8" class="particle-2" />
  <circle cx="1080" cy="110" r="3.5" fill="#c084fc" class="particle-3" />
  <circle cx="920" cy="80" r="2.5" fill="#38bdf8" class="particle-1" />
  <circle cx="150" cy="340" r="4" fill="#a855f7" class="particle-2" />
  <circle cx="1020" cy="360" r="3" fill="#38bdf8" class="particle-3" />

  <!-- Background Decorative Code Bracket Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 90,185 L 65,210 L 90,235" />
    <path d="M 1110,185 L 1135,210 L 1110,235" />
    <line x1="115" y1="235" x2="135" y2="185" />
  </g>

  <!-- FOREGROUND CONTENT -->
  <!-- Tagline Pill -->
  <g transform="translate(425, 58)">
    <rect width="350" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" class="tagline">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="152" text-anchor="middle" class="title">
    Awesome AI Developer Assistant Copilots
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="subtitle">
    Autonomous Coding Agents • AI-Native IDEs • Local LLMs • Air-Gapped Copilots
  </text>

  <!-- Feature Pills in Center-Bottom -->
  <g transform="translate(145, 255)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="#0f172a" fill-opacity="0.92" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="90" y="26" text-anchor="middle" class="pill-text">⚡ 10+ Open-Source</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="185" height="42" rx="21" fill="#0f172a" fill-opacity="0.92" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="92" y="26" text-anchor="middle" class="pill-text">🏢 Enterprise SaaS</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="195" height="42" rx="21" fill="#0f172a" fill-opacity="0.92" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="97" y="26" text-anchor="middle" class="pill-text">🔒 100% Local / Self-Hosted</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(620, 0)">
      <rect width="160" height="42" rx="21" fill="#0f172a" fill-opacity="0.92" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="80" y="26" text-anchor="middle" class="pill-text">🤖 Agentic Workflows</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(800, 0)">
      <rect width="110" height="42" rx="21" fill="#0f172a" fill-opacity="0.92" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="55" y="26" text-anchor="middle" class="pill-text" fill="#4ade80">⭐ Verified</text>
    </g>
  </g>

  <!-- Lower Accent Gradient Divider -->
  <line x1="220" y1="365" x2="980" y2="365" stroke="url(#textGrad)" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="600" cy="365" r="3.5" fill="#38bdf8" />
</svg>
