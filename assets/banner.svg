<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.15)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    
    /* Dynamic floating particles & glowing waves */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-30px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pillPulse {
      0%, 100% { border-color: rgba(56, 189, 248, 0.3); }
      50% { border-color: rgba(192, 132, 252, 0.7); }
    }

    .orb-1 {
      transform-origin: 200px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-2 {
      transform-origin: 1000px 320px;
      animation: pulseOrb 10s ease-in-out infinite reverse;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .particle-delayed {
      animation: floatParticle 7.5s ease-in-out infinite 2s;
    }
    .beam {
      stroke-dasharray: 80 120;
      animation: beamFlow 12s linear infinite;
    }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" class="bg" />

  <!-- Background Grid Pattern -->
  <g class="grid">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Animated Glowing Ambient Orbs (Background Level - Behind Text) -->
  <g filter="url(#glow)">
    <circle cx="220" cy="110" r="130" fill="#0284c7" class="orb-1" />
    <circle cx="980" cy="300" r="140" fill="#7c3aed" class="orb-2" />
    <circle cx="600" cy="200" r="90" fill="#0d9488" opacity="0.25" class="orb-1" />
  </g>

  <!-- Dynamic Curved Energy Beams -->
  <path d="M-50,320 C300,180 800,380 1250,160" fill="none" stroke="url(#textGrad)" stroke-width="2.5" opacity="0.4" class="beam" />
  <path d="M-50,120 C350,300 850,80 1250,280" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" class="beam" style="animation-direction: reverse; animation-duration: 16s;" />

  <!-- Dynamic Floating Accent Dots (Safe Zones) -->
  <circle cx="120" cy="90" r="3" fill="#38bdf8" class="particle" />
  <circle cx="340" cy="60" r="2.5" fill="#818cf8" class="particle-delayed" />
  <circle cx="1080" cy="110" r="3" fill="#c084fc" class="particle" />
  <circle cx="920" cy="80" r="2" fill="#38bdf8" class="particle-delayed" />
  <circle cx="150" cy="340" r="3.5" fill="#a855f7" class="particle" />
  <circle cx="1020" cy="360" r="2.5" fill="#38bdf8" class="particle-delayed" />

  <!-- Code/Tech Geometric Icons in Background (Faded) -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="2" fill="none">
    <!-- Code Bracket Left -->
    <path d="M 80,180 L 50,210 L 80,240" />
    <!-- Code Bracket Right -->
    <path d="M 1120,180 L 1150,210 L 1120,240" />
    <!-- Slash Node -->
    <line x1="110" y1="240" x2="130" y2="180" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Pills (Crisp & Perfectly Centered) -->
  <!-- Tagline Pill -->
  <g transform="translate(435, 60)">
    <rect width="330" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="20" cy="16" r="4.5" fill="#38bdf8" />
    <text x="35" y="21" class="tagline">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="152" text-anchor="middle" class="title" filter="url(#subtleGlow)">
    Awesome AI Developer Assistant Copilots
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="subtitle">
    Autonomous Coding Agents • AI-Native IDEs • Local LLMs • Air-Gapped Copilots
  </text>

  <!-- Feature Pills in Center-Bottom -->
  <g transform="translate(145, 255)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="90" y="26" text-anchor="middle" class="pill-text">⚡ 10+ Open-Source</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
      <text x="92" y="26" text-anchor="middle" class="pill-text">🏢 Enterprise SaaS</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="195" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
      <text x="97" y="26" text-anchor="middle" class="pill-text">🔒 100% Local / Self-Hosted</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(620, 0)">
      <rect width="160" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="80" y="26" text-anchor="middle" class="pill-text">🤖 Agentic Workflows</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(800, 0)">
      <rect width="110" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5" />
      <text x="55" y="26" text-anchor="middle" class="pill-text" fill="#4ade80">⭐ Verified</text>
    </g>
  </g>

  <!-- Lower Border Gradient Glow Line -->
  <line x1="200" y1="365" x2="1000" y2="365" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.5" />
  <circle cx="600" cy="365" r="3.5" fill="#38bdf8" />
</svg>
